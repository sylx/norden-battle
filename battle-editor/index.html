<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norden Battle Editor</title>
  </head>
  <body>
    <div id="viewport"></div>

    <aside id="panel">
      <header>
        <h1>Norden Battle Editor</h1>
        <div id="map-title" class="sub">-</div>
      </header>

      <section>
        <h2>マップ</h2>
        <label class="row">
          <span>保存済み</span>
          <select id="map-select"></select>
        </label>
        <div class="buttons">
          <button id="btn-map-list">一覧を更新</button>
          <button id="btn-open">JSON を開く</button>
        </div>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
        <p class="hint">map-editor で保存したマップ（assets/maps/）を読み込みます。JSON ファイルをドロップしても開けます</p>
      </section>

      <section>
        <h2>描画負荷</h2>
        <label class="row">
          <span>FPS</span>
          <output id="fps">-</output>
        </label>
        <label class="row">
          <span>解像度</span>
          <select id="pixel-ratio"></select>
        </label>
        <label class="row">
          <span>森</span>
          <select id="forest-mode">
            <option value="impostor">板絵（軽い）</option>
            <option value="mesh">3D モデル</option>
          </select>
        </label>
        <label class="check"><input id="chk-prepass" type="checkbox" /> 森の深度プリパス（3D のとき）</label>
        <label class="check"><input id="chk-dynamic-shadows" type="checkbox" /> 影を毎フレーム更新</label>
        <p class="hint">重いときは解像度を下げてください。深度プリパス・影はオフ/オンで負荷を比べる用です</p>
        <p id="gpu-name" class="hint"></p>
      </section>

      <section>
        <h2>HEX 情報</h2>
        <dl id="hover-info" class="info"></dl>
        <h3>選択中</h3>
        <dl id="select-info" class="info"></dl>
      </section>
    </aside>

    <div id="turn-bar">
      <span class="turn">ターン <output id="turn-number">1</output></span>
      <button id="btn-end-turn">ターン終了</button>
    </div>

    <div id="status"></div>
    <div id="drop-hint">ここにドロップして開く</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
